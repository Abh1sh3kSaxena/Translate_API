version: '3.8'

services:
  translator:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - model_cache:/app/model
    environment:
      - MODEL_DIR=/app/model
      - FLASK_APP=app.main:app
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  model_cache: